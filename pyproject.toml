[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-pltr"
version = "0.1.0"
description = "Applying ML in credit scoring with pltr."
readme = "README.md"
authors = [
    { name = "dunghoangq", email = "dunghoangq@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn"
]

[tool.setuptools.packages.find]
where = ["src"]